<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 侧边栏助手 — 设置</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-card: #16213e;
      --bg-input: #0f1a30;
      --text: #e0e0e0;
      --text-secondary: #a0a0b0;
      --accent: #4a9eff;
      --accent-hover: #6ab0ff;
      --border: #2a3a5a;
      --danger: #ff5555;
      --success: #50fa7b;
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      padding: 32px;
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.6;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 16px;
      margin-bottom: 16px;
      color: var(--accent);
    }

    .field {
      margin-bottom: 14px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 12px;
      font-size: 14px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    input[type="password"] {
      font-family: monospace;
    }

    input[type="range"] {
      padding: 0;
      background: transparent;
      border: none;
      accent-color: var(--accent);
    }

    .range-value {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .inline-fields {
      display: flex;
      gap: 12px;
    }

    .inline-fields .field {
      flex: 1;
    }

    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      font-family: var(--font);
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-success {
      background: var(--success);
      color: #000;
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--success);
      color: #000;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }

    .toast.error {
      background: var(--danger);
      color: white;
    }

    .help-text {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkbox-field input[type="checkbox"] {
      width: auto;
      accent-color: var(--accent);
    }

    .checkbox-field label {
      margin-bottom: 0;
      cursor: pointer;
    }

    .source-card {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .source-card .source-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .source-card .source-header select {
      width: auto;
      flex: 1;
      margin-right: 8px;
    }

    .source-card .source-header input[type="checkbox"] {
      width: auto;
      accent-color: var(--accent);
      margin-right: 4px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .btn-outline:hover {
      background: var(--accent);
      color: white;
    }
    .btn-sm {
      padding: 2px 10px;
      font-size: 12px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
      font-size: 13px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <h1>🤖 AI 侧边栏助手 — 设置</h1>

  <form id="settingsForm">
    <!-- LLM 配置 -->
    <div class="card">
      <h2>🧠 大模型 (LLM) 配置</h2>
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">
        支持任何兼容 OpenAI 协议的 API。常用端点：
      </p>

      <div class="field">
        <label for="llmPreset">快速选择</label>
        <select id="llmPreset">
          <option value="">— 手动输入 —</option>
          <option value="openai">OpenAI (api.openai.com)</option>
          <option value="claude">Claude (api.anthropic.com)</option>
          <option value="deepseek">DeepSeek (api.deepseek.com)</option>
          <option value="ollama">本地 Ollama (localhost:11434)</option>
          <option value="siliconflow">SiliconFlow (cloud.siliconflow.cn)</option>
        </select>
      </div>

      <div class="field">
        <label for="llmBaseURL">API Base URL *</label>
        <input type="url" id="llmBaseURL" placeholder="https://api.openai.com/v1" required>
      </div>

      <div class="field">
        <label for="llmApiKey">API Key *</label>
        <input type="password" id="llmApiKey" placeholder="sk-..." autocomplete="off">
        <div class="help-text">API Key 仅存储在本地浏览器中</div>
      </div>

      <div class="inline-fields">
        <div class="field">
          <label for="llmModel">模型名称</label>
          <input type="text" id="llmModel" placeholder="gpt-4o-mini">
        </div>
        <div class="field">
          <label for="llmMaxTokens">最大 Token</label>
          <input type="number" id="llmMaxTokens" min="512" max="128000" value="4096">
        </div>
      </div>

      <div class="field">
        <label for="llmTemperature">Temperature: <span id="tempValue">0.7</span></label>
        <input type="range" id="llmTemperature" min="0" max="2" step="0.1" value="0.7">
      </div>

      <div class="field">
        <label for="systemPrompt">系统提示词 (System Prompt)</label>
        <textarea id="systemPrompt" placeholder="你是一个有帮助的 AI 助手。请用中文回答。"></textarea>
      </div>
    </div>

    <!-- 搜索配置 -->
    <div class="card">
      <h2>🔍 搜索配置</h2>
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">
        可添加多个搜索源，请求时按顺序尝试，失败自动切换到下一个
      </p>

      <div id="searchSourcesList"></div>

      <button type="button" id="btnAddSource" class="btn btn-outline" style="margin-top:8px">➕ 添加搜索源</button>

      <hr>

      <div class="field">
        <label for="searchCount">每次返回结果数</label>
        <select id="searchCount">
          <option value="auto">🤖 模型自动选择</option>
          <option value="3">3 条</option>
          <option value="5">5 条</option>
          <option value="8">8 条</option>
          <option value="10">10 条</option>
        </select>
        <div class="help-text">选择"模型自动选择"时，AI 会根据问题自行判断需要参考几条结果</div>
      </div>
    </div>

    <!-- 通用设置 -->
    <div class="card">
      <h2>⚙️ 通用设置</h2>

      <div class="field checkbox-field">
        <input type="checkbox" id="contextMenu" checked>
        <label for="contextMenu">开启右键菜单 — 选中文字后右键可发送到侧边栏</label>
      </div>

      <div class="field checkbox-field">
        <input type="checkbox" id="defaultSearchMode">
        <label for="defaultSearchMode">默认开启搜索增强模式（侧边栏中的 🔍 开关）</label>
      </div>
    </div>

    <!-- 诊断 & 备份 -->
    <div class="card">
      <h2>🩺 诊断 & 备份</h2>
      <div class="btn-group" style="justify-content:flex-start">
        <button type="button" class="btn btn-outline" id="btnExport">📤 导出配置</button>
        <button type="button" class="btn btn-outline" id="btnImport">📥 导入配置</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
      <div style="margin-top:12px">
        <label style="font-size:12px;color:var(--text-secondary);margin-bottom:4px;display:block">当前存储的原始数据：</label>
        <pre id="rawStorageDump" style="background:var(--bg-input);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all;">加载中...</pre>
        <button type="button" class="btn btn-sm btn-outline" id="btnRefreshDump" style="margin-top:4px">🔄 刷新</button>
      </div>
    </div>

    <!-- 操作按钮 -->
    <div class="btn-group">
      <button type="button" class="btn btn-danger" id="btnReset">重置为默认</button>
      <button type="submit" class="btn">💾 保存设置</button>
    </div>
  </form>

  <div id="toast" class="toast"></div>

  <script type="module" src="options.js"></script>
</body>
</html>
